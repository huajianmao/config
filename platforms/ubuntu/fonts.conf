<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- 将通用 sans-serif 字体的首选替换为 MiSans -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>MiSans</family>
    </prefer>
  </alias>

  <!--
    MiSans 官方字体文件的 OS/2 usWeightClass 值非标准（整体比标准低一档），
    导致 fontconfig 把 Regular 识别为 53（应为 80）、Medium 识别为 75（应为 100）等，
    常规文字会渲染成 Medium，粗体会渲染成 Heavy。
    下面按扫描到的原始字重值将每个字重修正回标准值。
    注意：规则必须按字重从大到小排列，避免前面的赋值落入后面规则的范围。
  -->
  <match target="scan">
    <test name="family"><string>MiSans</string></test>
    <test name="weight" compare="more_eq"><int>195</int></test>
    <test name="weight" compare="less_eq"><int>215</int></test>
    <edit name="weight" mode="assign"><int>210</int></edit>
  </match> <!-- Heavy (200) -> black (210) -->
  <match target="scan">
    <test name="family"><string>MiSans</string></test>
    <test name="weight" compare="more_eq"><int>180</int></test>
    <test name="weight" compare="less"><int>193</int></test>
    <edit name="weight" mode="assign"><int>200</int></edit>
  </match> <!-- Bold (186) -> bold (200) -->
  <match target="scan">
    <test name="family"><string>MiSans</string></test>
    <test name="weight" compare="more_eq"><int>110</int></test>
    <test name="weight" compare="less"><int>130</int></test>
    <edit name="weight" mode="assign"><int>180</int></edit>
  </match> <!-- Semibold (116) -> semibold (180) -->
  <match target="scan">
    <test name="family"><string>MiSans</string></test>
    <test name="weight" compare="more_eq"><int>85</int></test>
    <test name="weight" compare="less"><int>100</int></test>
    <edit name="weight" mode="assign"><int>140</int></edit>
  </match> <!-- Demibold (90) -> 140 -->
  <match target="scan">
    <test name="family"><string>MiSans</string></test>
    <test name="weight" compare="more_eq"><int>70</int></test>
    <test name="weight" compare="less"><int>85</int></test>
    <edit name="weight" mode="assign"><int>100</int></edit>
  </match> <!-- Medium (75) -> medium (100) -->
  <match target="scan">
    <test name="family"><string>MiSans</string></test>

    <test name="weight" compare="more_eq"><int>52</int></test>
    <test name="weight" compare="less"><int>60</int></test>
    <edit name="weight" mode="assign"><int>80</int></edit>
  </match> <!-- Regular (53) -> regular (80) -->
  <match target="scan">
    <test name="family"><string>MiSans</string></test>
    <test name="weight" compare="more_eq"><int>48</int></test>
    <test name="weight" compare="less"><int>52</int></test>
    <edit name="weight" mode="assign"><int>55</int></edit>
  </match> <!-- Normal (50.5) -> demilight (55) -->
  <match target="scan">
    <test name="family"><string>MiSans</string></test>
    <test name="weight" compare="more_eq"><int>42</int></test>
    <test name="weight" compare="less"><int>48</int></test>
    <edit name="weight" mode="assign"><int>50</int></edit>
  </match> <!-- Light (45) -> light (50) -->
  <match target="scan">
    <test name="family"><string>MiSans</string></test>
    <test name="weight" compare="more_eq"><int>15</int></test>
    <test name="weight" compare="less"><int>30</int></test>
    <edit name="weight" mode="assign"><int>0</int></edit>
  </match> <!-- Thin (20) -> thin (0) -->
</fontconfig>

